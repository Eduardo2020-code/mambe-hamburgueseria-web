<section
  id="inicio"
  class="hero"
  aria-labelledby="hero-title"
>

  <!-- IMAGEN DE FONDO -->
  <img
    class="hero__background"
    ngSrc="assets/images/burger-hero.webp"
    fill
    priority
    alt="Hamburguesa artesanal Mambe"
  >


  <!-- CAPAS VISUALES -->
  <div class="hero__overlay"></div>

  <div class="hero__pattern"></div>


  <div class="container hero__content">


    <!-- CONTENIDO PRINCIPAL -->
    <div class="hero__copy">


      <!-- LOGO -->
      <img
        class="hero__logo"
        ngSrc="assets/images/logo-mambe.png"
        width="760"
        height="325"
        alt="Mambe Hamburguesería"
        priority
      >


      <!-- TÍTULO -->
      <h1 id="hero-title">

        Hamburguesas auténticas,

        <strong>
          hechas como tienen que hacerse.
        </strong>

      </h1>


      <!-- DESCRIPCIÓN -->
      <p class="hero__lead">

        Una experiencia gastronómica que celebra
        la identidad colombiana en cada bocado.

      </p>

    </div>


    <!-- MAESTRO MAMBE -->
    <div
      class="hero__character"
      aria-hidden="true"
    >

      <span
        class="hero__orbit hero__orbit--one"
      ></span>


      <span
        class="hero__orbit hero__orbit--two"
      ></span>


      <img
        ngSrc="assets/images/maestro-mambe.png"
        width="648"
        height="810"
        alt=""
        priority
      >

    </div>

  </div>


  <!-- INDICADOR DE SCROLL -->
  <button
    class="hero__scroll"
    type="button"
    (click)="scrollTo('nosotros')"
    aria-label="Bajar a Información"
  >

    <span>
      Descubre Mambe
    </span>

    <i></i>

  </button>

</section>
