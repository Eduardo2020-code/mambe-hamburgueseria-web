<section
  id="contacto"
  class="section contact"
  aria-labelledby="contact-title"
>

  <div class="container">

    <div
      class="contact__card"
      appReveal
    >

      <div
        class="contact__pattern"
        aria-hidden="true"
      ></div>


      <!-- ======================================
           INFORMACIÓN
           ====================================== -->

      <div class="contact__copy">

        <h2 id="contact-title">
          ¿Listo para probar Mambe?
        </h2>


        <p>
          Visítanos en Andalucía o Tuluá y disfruta hamburguesas
          auténticas, preparadas con pasión y sabor colombiano.
        </p>


        <!-- ======================================
             BOTÓN CHATBOT
             ====================================== -->

        <div class="contact__actions">

          <button
            class="contact__chat-button"
            type="button"
            (click)="openChat()"
          >

            <span class="contact__chat-avatar">

              <img
                src="assets/images/maestro-mambe.png"
                alt="Maestro Mambe"
              >

            </span>


            <span>
              Pregúntanos
            </span>

          </button>

        </div>


        <!-- ======================================
             REDES SOCIALES
             ====================================== -->

        <div class="contact__social-section">

          <span class="contact__social-title">
            Síguenos
          </span>


          <div class="contact__socials">


            <!-- INSTAGRAM -->

            <a
              href="https://www.instagram.com/mambe.hamburgueseria/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Instagram Mambe Hamburguesería"
              title="Instagram"
            >

              <img
                src="assets/images/logo1.png"
                alt="Instagram"
              >

            </a>


            <!-- FACEBOOK -->

            <a
              href="https://www.facebook.com/mambe.hamburgueseria/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Facebook Mambe Hamburguesería"
              title="Facebook"
            >

              <img
                src="assets/images/logo2.png"
                alt="Facebook"
              >

            </a>


            <!-- TIKTOK -->

            <a
              href="https://www.tiktok.com/@mambe.hamburgueseria?is_from_webapp=1&sender_device=pc"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="TikTok Mambe Hamburguesería"
              title="TikTok"
            >

              <img
                src="assets/images/77.png"
                alt="TikTok"
              >

            </a>


          </div>

        </div>

      </div>


      <!-- ======================================
           IMAGEN HAMBURGUESA
           ====================================== -->

      <div
        class="contact__media"
        aria-hidden="true"
      >

        <div class="contact__image">

          <img
            src="assets/images/burger-03.webp"
            alt=""
          >

        </div>


        <span class="contact__ring"></span>


        <span
          class="contact__spark contact__spark--one"
        ></span>


        <span
          class="contact__spark contact__spark--two"
        ></span>

      </div>

    </div>

  </div>

</section>
