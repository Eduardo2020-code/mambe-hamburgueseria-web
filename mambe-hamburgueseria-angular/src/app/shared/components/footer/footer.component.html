<footer class="footer">
  <div class="container">
    <div class="footer__grid">

      <!-- MARCA -->
      <div class="footer__brand">
        <img
          src="assets/images/logo-mambe.png"
          alt="Mambe Hamburguesería"
          class="footer__logo"
        >

        <p>
          Hamburguesas auténticas inspiradas en el arte, la cultura y la tradición colombiana.
        </p>
      </div>

      <!-- NAVEGACIÓN -->
      <div class="footer__navigation">
        <h3>NAVEGA</h3>

        <nav aria-label="Navegación del pie de página">
          @for (link of navigation; track link.target) {
            <button
              type="button"
              (click)="scrollTo(link.target)"
            >
              {{ link.label }}
            </button>
          }
        </nav>
      </div>

      <!-- SOLO EL MUÑECO -->
      <div class="footer__maestro-only">
        <div class="footer__maestro-ring"></div>
        <div class="footer__maestro-ring footer__maestro-ring--small"></div>

        <img
          src="assets/images/maestro-mambe.png"
          alt="Maestro Mambe"
          class="footer__maestro-image"
        >
      </div>

    </div>

    <div class="footer__bottom">
      <p>
        © {{ currentYear }} Mambe Hamburguesería. Todos los derechos reservados.
      </p>

      <span>
        Andalucía · Tuluá · Valle del Cauca
      </span>
    </div>
  </div>
</footer>
