<header
  class="navbar"
  [class.navbar--scrolled]="scrolled"
  [class.navbar--open]="menuOpen"
>
  <div class="container navbar__inner">
    <button
      class="navbar__brand"
      type="button"
      aria-label="Ir al inicio"
      (click)="scrollTo('inicio')"
    >
      <img
        ngSrc="assets/images/logo-mambe.png"
        width="280"
        height="120"
        alt="Mambe Hamburguesería"
        priority
      >
    </button>

    <nav class="navbar__desktop" aria-label="Navegación principal">
      @for (link of links; track link.target) {
        <button type="button" (click)="scrollTo(link.target)">
          {{ link.label }}
        </button>
      }
    </nav>

    <a
      class="navbar__cta"
      [href]="whatsappUrl"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Pedir por WhatsApp"
    >
      <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20 11.6a8 8 0 0 1-11.8 7L4 20l1.4-4.1A8 8 0 1 1 20 11.6Z" stroke="currentColor" stroke-width="1.8"/>
        <path d="M9 8.7c.2-.5.4-.5.7-.5h.5c.2 0 .4 0 .5.4l.7 1.7c.1.3.1.5-.1.7l-.5.6c-.2.2-.2.4 0 .7.4.7 1 1.4 1.7 1.8.3.2.5.2.7-.1l.7-.8c.2-.2.4-.3.7-.2l1.6.8c.3.2.5.3.5.5 0 .2-.1 1.2-.6 1.7-.5.6-1.2.8-2 .7-1-.1-2.2-.6-3.7-1.9-1.8-1.6-2.9-3.5-3-4.7-.1-.8.2-1.4.6-1.8Z" fill="currentColor"/>
      </svg>
      <span>Pedir</span>
    </a>

    <button
      class="navbar__toggle"
      type="button"
      [attr.aria-expanded]="menuOpen"
      aria-controls="mobile-menu"
      aria-label="Abrir o cerrar el menú"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>

  <div id="mobile-menu" class="navbar__mobile" [attr.aria-hidden]="!menuOpen">
    <nav aria-label="Navegación móvil">
      @for (link of links; track link.target; let index = $index) {
        <button type="button" (click)="scrollTo(link.target)">
          <span>0{{ index + 1 }}</span>
          {{ link.label }}
        </button>
      }

      <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer">
        Pedir por WhatsApp
      </a>
    </nav>
  </div>
</header>
