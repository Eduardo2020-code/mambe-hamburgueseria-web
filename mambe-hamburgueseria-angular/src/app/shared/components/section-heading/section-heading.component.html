<div class="section-heading">

  @if (eyebrow()) {
    <div class="section-heading__eyebrow">
      <span></span>
      {{ eyebrow() }}
    </div>
  }

  <h2 class="section-heading__title">
    {{ title() }}
  </h2>

  @if (description()) {
    <p class="section-heading__description">
      {{ description() }}
    </p>
  }

</div>
